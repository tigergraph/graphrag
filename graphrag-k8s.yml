apiVersion: v1
kind: Namespace
metadata:
  name: graphrag

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphrag
  namespace: graphrag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graphrag
  template:
    metadata:
      labels:
        app: graphrag
    spec:
      containers:
        - name: graphrag
          image: tigergraph/graphrag:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: SERVER_CONFIG
              value: "/code/configs/server_config.json"
            - name: LOGLEVEL
              value: "INFO"
            - name: USE_CYPHER
              value: "true"
            - name: GRAPHRAG_MEMORY_ENABLED
              value: "true"
            - name: GRAPHRAG_MEMORY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: graphrag-postgres
                  key: database-url
          volumeMounts:
            - name: configs
              mountPath: /code/configs
      volumes:
        - name: configs
          hostPath:
            path: /path/to/graphrag/configs   # <-- path on the node
            type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: graphrag
  namespace: graphrag
spec:
  selector:
    app: graphrag
  ports:
    - port: 8000
      targetPort: 8000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphrag-ecc
  namespace: graphrag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graphrag-ecc
  template:
    metadata:
      labels:
        app: graphrag-ecc
    spec:
      containers:
        - name: graphrag-ecc
          image: tigergraph/graphrag-ecc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
            - name: SERVER_CONFIG
              value: "/code/configs/server_config.json"
            - name: LOGLEVEL
              value: "INFO"
            - name: INIT_EMBED_STORE
              value: "false"
          volumeMounts:
            - name: configs
              mountPath: /code/configs
      volumes:
        - name: configs
          hostPath:
            path: /path/to/graphrag/configs
            type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: graphrag-ecc
  namespace: graphrag
spec:
  selector:
    app: graphrag-ecc
  ports:
    - port: 8001
      targetPort: 8001

---
apiVersion: v1
kind: Secret
metadata:
  name: graphrag-postgres
  namespace: graphrag
type: Opaque
stringData:
  password: change-me
  database-url: postgresql+psycopg://graphrag:change-me@postgres:5432/graphrag

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: graphrag-postgres
  namespace: graphrag
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: graphrag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: graphrag
            - name: POSTGRES_USER
              value: graphrag
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: graphrag-postgres
                  key: password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: graphrag-postgres

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: graphrag
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphrag-ui
  namespace: graphrag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graphrag-ui
  template:
    metadata:
      labels:
        app: graphrag-ui
    spec:
      containers:
        - name: graphrag-ui
          image: tigergraph/graphrag-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: graphrag-ui
  namespace: graphrag
spec:
  selector:
    app: graphrag-ui
  ports:
    - port: 3000
      targetPort: 3000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: graphrag-ingress
  namespace: graphrag
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-set-headers: "Upgrade=$http_upgrade,Connection=Upgrade"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # /chat-, /chat, /chat-dialog
          - path: /chat-
            pathType: Prefix
            backend:
              service:
                name: graphrag-ui
                port:
                  number: 3000

          - path: /chat
            pathType: Prefix
            backend:
              service:
                name: graphrag-ui
                port:
                  number: 3000

          # Regex path: /.+/graphrag/.+
          - path: /.+/graphrag/.+
            pathType: ImplementationSpecific
            backend:
              service:
                name: graphrag
                port:
                  number: 8000

          # Regex path: /.+/supportai/.+
          - path: /.+/supportai/.+
            pathType: ImplementationSpecific
            backend:
              service:
                name: graphrag
                port:
                  number: 8000

          # Regex path: /ui/.*/chat
          - path: /ui/.*/chat
            pathType: ImplementationSpecific
            backend:
              service:
                name: graphrag
                port:
                  number: 8000

          # /ui/ fallback
          - path: /ui/
            pathType: Prefix
            backend:
              service:
                name: graphrag
                port:
                  number: 8000

          # Root path
          - path: /
            pathType: Prefix
            backend:
              service:
                name: graphrag-ui
                port:
                  number: 3000
