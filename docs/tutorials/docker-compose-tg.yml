services:
  graphrag:
    image: tigergraph/graphrag:latest 
    platform: linux/amd64
    container_name: graphrag
    build:
      context: .
      dockerfile: graphrag/Dockerfile
    ports:
      - 8000:8000
    depends_on:
      graphrag-ecc:
        condition: service_started
      history-bootstrap:
        condition: service_completed_successfully
    environment:
      SERVER_CONFIG: "/code/configs/server_config.json"
      LOGLEVEL: "INFO"
      USE_CYPHER: "true"
      CHAT_HISTORY_GRAPH: "${CHAT_HISTORY_GRAPH:-GraphRAGChatHistory}"
      CHAT_HISTORY_TG_USERNAME: "${CHAT_HISTORY_RUNTIME_USERNAME}"
      CHAT_HISTORY_TG_PASSWORD: "${CHAT_HISTORY_RUNTIME_PASSWORD}"
    volumes:
      - ./configs/:/code/configs

  graphrag-ecc:
    image: tigergraph/graphrag-ecc:latest
    platform: linux/amd64
    container_name: graphrag-ecc
    build:
      context: .
      dockerfile: ecc/Dockerfile
    ports:
      - 8001:8001
    environment:
      SERVER_CONFIG: "/code/configs/server_config.json"
      LOGLEVEL: "INFO"
      INIT_EMBED_STORE: "false"
    volumes:
      - ./configs/:/code/configs

  history-bootstrap:
    image: tigergraph/graphrag:latest
    platform: linux/amd64
    build:
      context: .
      dockerfile: graphrag/Dockerfile
    command: ["python", "-m", "common.chat_history.bootstrap"]
    environment:
      SERVER_CONFIG: "/code/configs/server_config.json"
      CHAT_HISTORY_GRAPH: "${CHAT_HISTORY_GRAPH:-GraphRAGChatHistory}"
      CHAT_HISTORY_BOOTSTRAP_USERNAME: "${TIGERGRAPH_USERNAME}"
      CHAT_HISTORY_BOOTSTRAP_PASSWORD: "${TIGERGRAPH_PASSWORD}"
      CHAT_HISTORY_RUNTIME_USERNAME: "${CHAT_HISTORY_RUNTIME_USERNAME}"
    volumes:
      - ./configs/:/code/configs

  history-retention:
    image: tigergraph/graphrag:latest
    platform: linux/amd64
    profiles: ["maintenance"]
    command: ["python", "-m", "common.chat_history.retention"]
    depends_on:
      history-bootstrap:
        condition: service_completed_successfully
    environment:
      SERVER_CONFIG: "/code/configs/server_config.json"
      CHAT_HISTORY_GRAPH: "${CHAT_HISTORY_GRAPH:-GraphRAGChatHistory}"
      CHAT_HISTORY_TG_USERNAME: "${CHAT_HISTORY_RUNTIME_USERNAME}"
      CHAT_HISTORY_TG_PASSWORD: "${CHAT_HISTORY_RUNTIME_PASSWORD}"
    volumes:
      - ./configs/:/code/configs

  graphrag-ui:
    image: tigergraph/graphrag-ui:latest 
    platform: linux/amd64
    container_name: graphrag-ui 
    build:
      context: graphrag-ui
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    depends_on:
      - graphrag

  nginx:
    container_name: nginx
    image: nginx
    volumes:
      - ./configs/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - graphrag-ui
      - graphrag
