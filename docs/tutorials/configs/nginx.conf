server {
  listen 80;
  client_max_body_size 100M;

  location / {
    proxy_pass http://graphrag-ui:3000;
  }

  location /chat- {
    proxy_pass http://graphrag-ui:3000;
  }

  location /chat {
    proxy_pass http://graphrag-ui:3000/;
  }

  location /setup {
    rewrite ^/setup$ / break;
    proxy_pass http://graphrag-ui:3000;
  }

  location /setup/ {
    rewrite ^/setup/.*$ / break;
    proxy_pass http://graphrag-ui:3000;
  }


  location /chat-dialog {
    proxy_pass http://graphrag-ui:3000/;
  }

  location /trace {
    proxy_pass http://graphrag-ui:3000;
  }

  location /trace/ {
    proxy_pass http://graphrag-ui:3000;
  }

  location ~^/ui/.*/chat$ {
    proxy_pass http://graphrag:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_read_timeout 86400;
  }

  # Deep Agent REST API (/{graph}/agent/chat|tools|threads|memories) for
  # external callers. Answers can take minutes, hence the long read timeout.
  location ~ ^/[A-Za-z_][A-Za-z0-9_]*/agent/(chat|tools|threads|memories)(/|$) {
    proxy_pass http://graphrag:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 600;
    proxy_send_timeout 600;
    proxy_connect_timeout 60;
  }

  location /ui/ {
    proxy_pass http://graphrag:8000;
    proxy_http_version 1.1;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_connect_timeout 60;
  }
}
