apiVersion: v1
kind: Namespace
metadata:
  name: graphrag

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tigergraph-data
  namespace: graphrag
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tigergraph
  namespace: graphrag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tigergraph
  template:
    metadata:
      labels:
        app: tigergraph
    spec:
      containers:
        - name: tigergraph
          image: tigergraph/community:4.2.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 14240
          readinessProbe:
            httpGet:
              path: /api/ping
              port: 14240
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 20
          volumeMounts:
            - mountPath: /home/tigergraph/tigergraph/data
              name: tigergraph-storage
      volumes:
        - name: tigergraph-storage
          persistentVolumeClaim:
            claimName: tigergraph-data
---
apiVersion: v1
kind: Service
metadata:
  name: tigergraph
  namespace: graphrag
spec:
  selector:
    app: tigergraph
  ports:
    - protocol: TCP
      port: 14240
      targetPort: 14240
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphrag
  namespace: graphrag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graphrag
  template:
    metadata:
      labels:
        app: graphrag
    spec:
      containers:
        - name: graphrag
          image: tigergraph/graphrag:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health/history
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          env:
            - name: SERVER_CONFIG
              value: "/code/configs/server_config.json"
            - name: LOGLEVEL
              value: "INFO"
            - name: USE_CYPHER
              value: "true"
            - name: CHAT_HISTORY_GRAPH
              value: "GraphRAGChatHistory"
            - name: CHAT_HISTORY_TG_USERNAME
              valueFrom:
                secretKeyRef:
                  name: graphrag-chat-history
                  key: runtime-username
            - name: CHAT_HISTORY_TG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: graphrag-chat-history
                  key: runtime-password
          volumeMounts:
            - name: configs
              mountPath: /code/configs
      volumes:
        - name: configs
          hostPath:
            path: /path/to/graphrag/configs   # <-- path on the node
            type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: graphrag
  namespace: graphrag
spec:
  selector:
    app: graphrag
  ports:
    - port: 8000
      targetPort: 8000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphrag-ecc
  namespace: graphrag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graphrag-ecc
  template:
    metadata:
      labels:
        app: graphrag-ecc
    spec:
      containers:
        - name: graphrag-ecc
          image: tigergraph/graphrag-ecc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
            - name: SERVER_CONFIG
              value: "/code/configs/server_config.json"
            - name: LOGLEVEL
              value: "INFO"
            - name: INIT_EMBED_STORE
              value: "false"
          volumeMounts:
            - name: configs
              mountPath: /code/configs
      volumes:
        - name: configs
          hostPath:
            path: /path/to/graphrag/configs
            type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: graphrag-ecc
  namespace: graphrag
spec:
  selector:
    app: graphrag-ecc
  ports:
    - port: 8001
      targetPort: 8001

---
apiVersion: batch/v1
kind: Job
metadata:
  name: graphrag-history-bootstrap
  namespace: graphrag
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: tigergraph/graphrag:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "common.chat_history.bootstrap"]
          env:
            - name: SERVER_CONFIG
              value: "/code/configs/server_config.json"
            - name: CHAT_HISTORY_GRAPH
              value: "GraphRAGChatHistory"
            - name: CHAT_HISTORY_BOOTSTRAP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: graphrag-chat-history
                  key: bootstrap-username
            - name: CHAT_HISTORY_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: graphrag-chat-history
                  key: bootstrap-password
            - name: CHAT_HISTORY_RUNTIME_USERNAME
              valueFrom:
                secretKeyRef:
                  name: graphrag-chat-history
                  key: runtime-username
          volumeMounts:
            - name: configs
              mountPath: /code/configs
      volumes:
        - name: configs
          hostPath:
            path: /path/to/graphrag/configs
            type: DirectoryOrCreate

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: graphrag-history-retention
  namespace: graphrag
spec:
  schedule: "17 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: retention
              image: tigergraph/graphrag:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "common.chat_history.retention"]
              env:
                - name: SERVER_CONFIG
                  value: "/code/configs/server_config.json"
                - name: CHAT_HISTORY_GRAPH
                  value: "GraphRAGChatHistory"
                - name: CHAT_HISTORY_TG_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: graphrag-chat-history
                      key: runtime-username
                - name: CHAT_HISTORY_TG_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: graphrag-chat-history
                      key: runtime-password
              volumeMounts:
                - name: configs
                  mountPath: /code/configs
          volumes:
            - name: configs
              hostPath:
                path: /path/to/graphrag/configs
                type: DirectoryOrCreate

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphrag-ui
  namespace: graphrag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graphrag-ui
  template:
    metadata:
      labels:
        app: graphrag-ui
    spec:
      containers:
        - name: graphrag-ui
          image: tigergraph/graphrag-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: graphrag-ui
  namespace: graphrag
spec:
  selector:
    app: graphrag-ui
  ports:
    - port: 3000
      targetPort: 3000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: graphrag-ingress
  namespace: graphrag
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-set-headers: "Upgrade=$http_upgrade,Connection=Upgrade"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # /chat-, /chat, /chat-dialog
          - path: /chat-
            pathType: Prefix
            backend:
              service:
                name: graphrag-ui
                port:
                  number: 3000

          - path: /chat
            pathType: Prefix
            backend:
              service:
                name: graphrag-ui
                port:
                  number: 3000

          # Regex path: /.+/graphrag/.+
          - path: /.+/graphrag/.+
            pathType: ImplementationSpecific
            backend:
              service:
                name: graphrag
                port:
                  number: 8000

          # Regex path: /.+/supportai/.+
          - path: /.+/supportai/.+
            pathType: ImplementationSpecific
            backend:
              service:
                name: graphrag
                port:
                  number: 8000

          # Regex path: /ui/.*/chat
          - path: /ui/.*/chat
            pathType: ImplementationSpecific
            backend:
              service:
                name: graphrag
                port:
                  number: 8000

          # /ui/ fallback
          - path: /ui/
            pathType: Prefix
            backend:
              service:
                name: graphrag
                port:
                  number: 8000

          # Root path
          - path: /
            pathType: Prefix
            backend:
              service:
                name: graphrag-ui
                port:
                  number: 3000
